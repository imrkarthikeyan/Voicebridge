services:
  postgres:
    image: postgres:16-alpine
    container_name: voicebridge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voicebridge}
      POSTGRES_USER: ${POSTGRES_USER:-voicebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicebridge_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-voicebridge} -d $${POSTGRES_DB:-voicebridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicebridge-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-voicebridge}
      DATABASE_USERNAME: ${POSTGRES_USER:-voicebridge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-voicebridge_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production-min-256-bits-long}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1}
      QR_BASE_URL: ${QR_BASE_URL:-http://localhost}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voicebridge-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
