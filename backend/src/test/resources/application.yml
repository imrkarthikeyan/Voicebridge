spring:
  datasource:
    url: jdbc:h2:mem:voicebridge-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-not-for-production-use-1234
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  qr:
    base-url: http://localhost:5173
