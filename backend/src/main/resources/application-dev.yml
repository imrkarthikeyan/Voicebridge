spring:
  datasource:
    url: jdbc:h2:mem:voicebridge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.voicebridge: DEBUG
    org.springframework.security: INFO
